name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/beehive-browser/**'
      - 'frontend/**'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download CloakBrowser kernel
        shell: bash
        run: |
          curl -L -o /tmp/cloakbrowser-win.zip https://github.com/CloakHQ/CloakBrowser/releases/download/chromium-v146.0.7680.177.4/cloakbrowser-windows-x64.zip
          7z x /tmp/cloakbrowser-win.zip -o/tmp/cloakbrowser-win/
          mkdir -p desktop/beehive-browser/cloakbrowser-core
          cp -r /tmp/cloakbrowser-win/* desktop/beehive-browser/cloakbrowser-core/
          mv desktop/beehive-browser/cloakbrowser-core/chrome.exe desktop/beehive-browser/cloakbrowser-core/CloakBrowser.exe || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build frontend
        run: |
          npm install
          npm run build
        working-directory: frontend
        shell: bash

      - name: Build Tauri app (Windows x64)
        run: |
          cargo tauri build --target x86_64-pc-windows-msvc
        working-directory: desktop/beehive-browser
        shell: bash
        env:
          FORCE_COLOR: 0

      - name: Upload to Release (beehive-releases)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.2.0"
          gh release create "$TAG" \
            --repo roymaste/beehive-releases \
            --title "蜂巢智能体 $TAG" \
            --notes "桌面客户端 $TAG（Windows x64）" \
            desktop/beehive-browser/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe \
            desktop/beehive-browser/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi || true
          gh release upload "$TAG" \
            --repo roymaste/beehive-releases \
            --clobber \
            desktop/beehive-browser/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe \
            desktop/beehive-browser/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beehive-windows-x64
          path: |
            desktop/beehive-browser/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            desktop/beehive-browser/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 5
