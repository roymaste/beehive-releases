name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/beehive-browser/**'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri app (Windows MSI + NSIS)
        run: |
          cargo tauri build --bundles "msi,nsis"
        working-directory: desktop/beehive-browser
        shell: bash
        env:
          FORCE_COLOR: 0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beehive-windows-installer
          path: |
            desktop/beehive-browser/target/release/bundle/msi/*.msi
            desktop/beehive-browser/target/release/bundle/nsis/*.exe
          retention-days: 30
