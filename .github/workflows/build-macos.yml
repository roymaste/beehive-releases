name: Build macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/beehive-browser/**'
      - 'frontend/**'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build Tauri app (universal binary)
        run: |
          cargo tauri build --target universal-apple-darwin
        working-directory: desktop/beehive-browser
        env:
          FORCE_COLOR: 0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beehive-macos-universal
          path: |
            desktop/beehive-browser/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            desktop/beehive-browser/target/universal-apple-darwin/release/bundle/macos/*.app
          retention-days: 30
