name: Build Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/beehive-browser/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Build Tauri app (deb)
        run: |
          cargo tauri build --bundles "deb"
        working-directory: desktop/beehive-browser
        env:
          FORCE_COLOR: 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beehive-linux-deb
          path: |
            desktop/beehive-browser/target/release/bundle/deb/*.deb
          retention-days: 30
