name: Build Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/beehive-browser/**'
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Download CloakBrowser kernel
        run: |
          curl -L -o cloakbrowser-kernel.tar.gz https://github.com/roymaste/beehive-releases/releases/download/v0.1.1/cloakbrowser-chromium-146.tar.gz
          tar -xzf cloakbrowser-kernel.tar.gz -C desktop/beehive-browser/

      - name: Build frontend
        run: |
          npm install
          npm run build
        working-directory: frontend

      - name: Copy frontend dist
        run: |
          cp -r frontend/dist/* desktop/beehive-browser/frontend/dist/

      - name: Build Tauri app (AppImage)
        run: |
          cargo tauri build --bundles "appimage"
        working-directory: desktop/beehive-browser
        env:
          TAURI_SKIP_DEVSERVER_CHECK: true

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: beehive-linux-appimage
          path: |
            desktop/beehive-browser/target/release/bundle/appimage/*.AppImage
          retention-days: 5
