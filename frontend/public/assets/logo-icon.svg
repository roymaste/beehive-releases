<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Honeycomb hexagon with bee icon -->
  <defs>
    <linearGradient id="beeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42a5f5"/>
      <stop offset="100%" stop-color="#1976d2"/>
    </linearGradient>
  </defs>
  
  <!-- Hexagon outline - yellow #FFC107 -->
  <path d="M24 4 L42 14 L42 34 L24 44 L6 34 L6 14 Z" 
        fill="none" 
        stroke="#ffc107" 
        stroke-width="2" 
        stroke-linejoin="round"/>
  
  <!-- Hexagon internal lines -->
  <line x1="24" y1="4" x2="24" y2="44" stroke="#ffc107" stroke-width="1.5" opacity="0.6"/>
  <line x1="6" y1="14" x2="42" y2="34" stroke="#ffc107" stroke-width="1" opacity="0.35"/>
  <line x1="42" y1="14" x2="6" y2="34" stroke="#ffc107" stroke-width="1" opacity="0.35"/>
  
  <!-- Stylized bee - blue geometric -->
  <g transform="translate(24, 24)">
    <!-- Bee body (ellipse) -->
    <ellipse cx="0" cy="0" rx="7" ry="5" fill="url(#beeGrad)"/>
    <!-- Bee stripes -->
    <rect x="-4" y="-2" width="2" height="4" fill="#ffc107" opacity="0.8"/>
    <rect x="0" y="-2" width="2" height="4" fill="#ffc107" opacity="0.8"/>
    <rect x="4" y="-2" width="2" height="4" fill="#ffc107" opacity="0.8"/>
    <!-- Bee wings -->
    <ellipse cx="-4" cy="-6" rx="4" ry="2.5" fill="#fff" opacity="0.7" transform="rotate(-20)"/>
    <ellipse cx="4" cy="-6" rx="4" ry="2.5" fill="#fff" opacity="0.7" transform="rotate(20)"/>
  </g>
</svg>